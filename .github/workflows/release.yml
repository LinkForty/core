name: Release

on:
  push:
    branches:
      - main

# Only allow one release at a time
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release to NPM & GitHub
    runs-on: ubuntu-latest
    # IMPORTANT: Only runs on main branch from the main repo (not forks)
    if: github.repository == 'linkforty/core' && github.ref == 'refs/heads/main'
    timeout-minutes: 20
    environment: npm-production

    permissions:
      contents: write # To create releases and tags
      issues: write # To comment on released issues
      pull-requests: write # To comment on released PRs
      id-token: write # For NPM provenance

    steps:
      # semantic-release pushes the release commit and tag straight to main.
      # main's ruleset only lets repository admins and the LinkForty bot app
      # bypass the pull-request requirement, and GitHub does not allow the
      # workflow's own GITHUB_TOKEN as a bypass actor, so the push has to be
      # made with the app's token. The "[skip ci]" in the release commit
      # message keeps that push from starting another CI or release run.
      - name: Mint bot token
        id: bot
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.LINKFORTY_BOT_APP_ID }}
          private-key: ${{ secrets.LINKFORTY_BOT_PRIVATE_KEY }}

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for semantic-release
          token: ${{ steps.bot.outputs.token }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Release
        env:
          GITHUB_TOKEN: ${{ steps.bot.outputs.token }}
        run: npx semantic-release

  # Notify on failure
  notify-failure:
    name: Notify Release Failure
    runs-on: ubuntu-latest
    needs: release
    if: failure() && github.repository == 'linkforty/core'

    permissions:
      issues: write # To create failure notification issues

    steps:
      - name: Create issue on failure
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Release failed on ${new Date().toISOString()}`;
            const body = `The release workflow failed. Please check the [workflow run](${context.payload.repository.html_url}/actions/runs/${context.runId}).`;

            // Check if issue already exists
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'release-failure'
            });

            if (issues.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['release-failure', 'automated']
              });
            }
