services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-linkforty}
      POSTGRES_USER: ${POSTGRES_USER:-linkforty}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-linkforty}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  linkforty:
    # Use published image (recommended for production)
    image: linkforty/core:latest

    # OR build from source (for development)
    # Uncomment the lines below and comment out the 'image:' line above
    # build:
    #   context: .
    #   dockerfile: Dockerfile

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Database configuration
      DATABASE_URL: postgresql://${POSTGRES_USER:-linkforty}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-linkforty}?sslmode=disable

      # Redis configuration
      REDIS_URL: redis://redis:6379

      # Server configuration
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}
      HOST: ${HOST:-0.0.0.0}
      CORS_ORIGIN: ${CORS_ORIGIN:-}

      # Behind a reverse proxy or CDN: read the visitor's IP instead of the
      # proxy's, or installs are never attributed to clicks. Set one of these
      # in .env; see .env.example. Leave both unset when clients reach Core directly.
      TRUST_PROXY: ${TRUST_PROXY:-}
      TRUSTED_CLIENT_IP_HEADER: ${TRUSTED_CLIENT_IP_HEADER:-}

      # Optional: base URL encoded in QR codes, including the scheme.
      SHORTLINK_DOMAIN: ${SHORTLINK_DOMAIN:-}

      # Optional: trust the x-lf-bot header. Only behind a proxy that sets it
      # and strips copies sent by clients.
      TRUST_EDGE_BOT_HEADER: ${TRUST_EDGE_BOT_HEADER:-}

      # Optional: path inside the container to an IP-to-ASN database, for email
      # security scanner detection. Mount the file as well.
      ASN_DB_PATH: ${ASN_DB_PATH:-}

      # Optional: iOS Universal Links and Android App Links
      IOS_TEAM_ID: ${IOS_TEAM_ID:-}
      IOS_BUNDLE_ID: ${IOS_BUNDLE_ID:-}
      ANDROID_PACKAGE_NAME: ${ANDROID_PACKAGE_NAME:-}
      ANDROID_SHA256_FINGERPRINTS: ${ANDROID_SHA256_FINGERPRINTS:-}

    ports:
      - "${LINKFORTY_PORT:-3000}:3000"
    restart: unless-stopped

    # Optional: instance settings such as the not-found page. Copy
    # linkforty.config.example.json to linkforty.config.json, then uncomment.
    # (Create the file first: if it's missing, Docker mounts an empty directory.)
    # volumes:
    #   - ./linkforty.config.json:/app/linkforty.config.json:ro

    # /health is liveness (process up); /health/ready also checks the database.
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# Optional: Add network configuration for isolation
# networks:
#   linkforty:
#     driver: bridge
